# reflock hooks for the pre-commit framework.
#
# Advisory at commit time, enforcing at push time - the split DECISIONS.md
# section 3 describes.
#
# A gate that *fails* at pre-commit fires on partial work: a reference added in
# this commit whose target arrives in the next one is correctly DANGLING, and
# blocking that commit is friction a human is right to resent. pre-commit has no
# warn-only mode - a failing hook blocks whatever stage it runs in - so a hook
# may only run at commit time if the command it invokes cannot fail.
#
# reflock-stamp-check therefore runs `stamp --check --warn`, which reports and
# always exits 0. reflock-check enforces, and runs at pre-push. Install both
# stages once with:
#
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Both run over the whole tree (pass_filenames: false): a per-file invocation
# cannot see cross-file targets and would report references as DANGLING purely
# because the file defining the target was not passed in.

- id: reflock-check
  name: reflock check
  description: fail if any pinned cross-reference is broken or has drifted
  entry: reflock.py check
  language: script
  pass_filenames: false
  files: \.(md|markdown|txt|rst|py|sh|bash|zsh|fish|ya?ml|toml|json|rs|go|c|h|cpp|hpp|java|kt|rb|js|jsx|ts|tsx)$
  stages: [pre-push]

- id: reflock-stamp-check
  name: reflock stamp --check (advisory)
  description: report pins that stamp would add or rewrite, without writing or failing
  entry: reflock.py stamp --check --warn
  language: script
  pass_filenames: false
  files: \.(md|markdown|txt|rst|py|sh|bash|zsh|fish|ya?ml|toml|json|rs|go|c|h|cpp|hpp|java|kt|rb|js|jsx|ts|tsx)$
  stages: [pre-commit]
  verbose: true
