# reflock work queue
#
# The machine-readable projection of NORTHSTARS.md and IDEAS.md, for an
# orchestrator to answer one question: "what is the next unblocked item, and
# may an agent touch it?" The reasoning stays in the prose docs - this file
# holds only what a scheduler needs. If the two disagree, the prose wins and
# this file is stale.
#
# Cross-cutting calls the contracts depend on live in roadmap/DECIDED.md.
#
# Selection rule for a linear grind: take the FIRST item, in file order, whose
# status is `ready` and every one of whose blocked_by ids appears in `done`.
# File order is therefore the intended sequence, not incidental - reorder
# deliberately.
#
# owner:
#   agent  - mechanical and additive; contract states the definition of done
#   human  - needs a design decision, changes a published format, or touches a
#            question DECISIONS.md has already settled
#
# status:
#   ready          - contract written, may be picked up once blocked_by clears
#   needs-spec     - agent-ownable but no acceptance contract yet
#   needs-decision - an agent hit an ambiguity; a human must answer before it
#                    can proceed. Agents set this, never clear it.
#   blocked        - see blocked_by
#   in-progress    - an agent or branch holds it
#
# A shipped item leaves `items` entirely: its source entry in NORTHSTARS/IDEAS
# is deleted and its id moves to the `done` list at the foot of this file, so
# `items` stays the open queue rather than an append-only ledger.
#
# Invariant for every item, never restated per-entry: `just test`, `just bench`,
# `just check` and `just suspects` all pass, and one commit is one item.

version: 1

items:
  # The agent-facing surface (AGT-01..05) has shipped in full; its contracts stay
  # in roadmap/AGT-*.md and the cross-cutting calls in roadmap/DECIDED.md (D7,
  # D8). Nothing agent-owned is queued - the open items below are all yours.
  # --- human-owned: design decisions ----------------------------------------
  # Listed so the orchestrator can see them and skip them, not to schedule them.
  - id: NS-01
    title: Cross-repo references are silently OK, not even checked
    source: NORTHSTARS.md
    tier: medium
    owner: human
    status: blocked
    blocked_by: [design]
    note: Carries "do this first" in the prose. Sequencing call, not agent work.

