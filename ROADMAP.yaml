  - id: BUG-03
    title: stamp fabricates a pin for targets it cannot hash
    source: review 2026-07-28
    tier: near
    owner: agent
    status: done
    contract: roadmap/BUG-03-fabricated-pins.md
    blocked_by: [BENCH-01]
    touches: [reflock.py, test_reflock.py, evalbench/fixtures/]
    note: >-
      plan_stamp() re-derives the target path instead of using
      resolve_target(), so for an external, outside-tree, directory or binary
      target it hashes the empty string and writes e3b0c442 into the file.
      check() returns OK before the hash compare, so it never contradicts the
      fabricated pin - a silent false negative on the tool's core promise.
      Fixing it by unifying the two call sites also removes the duplication
      PR #12 flagged as a review risk.

  - id: BUG-04
    title: check exits 0 when a path argument matches nothing
    source: review 2026-07-28
    tier: near
    owner: agent
    status: done
    contract: roadmap/BUG-04-unmatched-scope.md
    blocked_by: [BENCH-01]
    touches: [reflock.py, test_reflock.py, evalbench/fixtures/]
    note: >-
      scoped_files() prefix-filters the index and yields nothing for an
      unmatched path, so `reflock check docs/` keeps passing after docs/ is
      renamed - the exact stale-reference rot reflock exists to catch, in
      reflock's own CI contract.

  - id: BUG-05
    title: stamp rewrites bytes it is not stamping
    source: review 2026-07-28
    tier: near
    owner: agent
    status: ready
    contract: roadmap/BUG-05-write-path-fidelity.md
    blocked_by: [BENCH-01]
    touches: [reflock.py, test_reflock.py, evalbench/fixtures/]
    note: >-
      Two defects in one write path. cmd_stamp round-trips the whole file
      through universal-newline decoding, so stamping one pin converts every
      CRLF in the file to LF; and it follows tracked symlinks, so it can
      modify a file outside the repository with git status showing nothing.

