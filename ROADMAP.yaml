  - id: BUG-01
    title: slugify treats link syntax inside a heading code span as a link
    source: roadmap/BUG-01-slugify-code-span.md
    tier: near
    owner: agent
    status: done
    contract: roadmap/BUG-01-slugify-code-span.md
    blocked_by: []
    touches: [reflock.py, test_reflock.py, evalbench/fixtures/]
    note: >
      Same class as closed issue #4 - a slug that diverges from GitHub's,
      producing a false DANGLING. Found by dogfooding this queue.

  - id: BUG-02
    title: Inline code spans are parsed as live references
    source: IDEAS.md
    tier: near
    owner: agent
    status: needs-spec
    blocked_by: []
    touches: [reflock.py]
    note: >
      MD_REF and CODE_REF fire inside single-backtick spans, so any doc that
      *documents* link or REF syntax in prose gets false DANGLINGs. Fenced
      blocks are already exempt; inline spans are not. Hit three times while
      writing the first two contracts in this queue - a doc-authoring tool
      that cannot document its own syntax inline is a real false-positive
      source, and false positives are what kill trust in a gate.

