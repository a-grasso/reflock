    contract: roadmap/ID-21-pre-commit-manifest.md
    blocked_by: [NS-03]
    touches: [.pre-commit-hooks.yaml, README.md]
    note: >-
      Resolved (a): `language: script` with `entry: reflock.py`, not
      `language: python` / `entry: reflock`. pre-commit's `language: python`
      installs the hook repo as a package to obtain a console script, and
      reflock ships no packaging metadata by design (D3). Both hooks default
      to `stages: [pre-push]`, which is how D6's "no hook that hard-fails a
      commit by default" is honored - pre-commit has no warn-only mode.

  - id: BENCH-01
    title: evalbench cannot assert stderr or cross-step byte identity
    source: agent-reported (grind iterations 3, 5, 7, 8)
    tier: near
    owner: agent
    status: done
    contract: roadmap/BENCH-01-bench-primitives.md
    blocked_by: []
    touches: [evalbench/run_bench.py, evalbench/README.md, test_reflock.py,
              evalbench/fixtures/]
    note: >-
      run_bench.py's step schema exposes only expect_json, expect_contains and
      expect_not_contains, all of which inspect stdout. Two capabilities the
      contracts keep asking for are therefore unavailable: asserting stderr
      content or emptiness, and asserting that two steps produced
      byte-identical stdout. Four shipped items worked around the gap rather
      than closing it - FMT-01 approximated "identical stdout and exit code
      with and without --format human" using matching expect_contains
      snippets; NS-03 approximated "writes nothing" with pin-marker regexes
      instead of comparing file bytes/mtime across steps; ID-13's contract
      asks for a summary line "only on stderr" and could only assert that
      stdout does NOT contain it; NS-04's github-format annotations have the
      same stream-destination problem. Every one of those assertions is
      weaker than the contract it claims to satisfy, and a regression that
      moved output between streams would pass the bench today. Contract also
      closes a hole found while specifying it: check_step reads assertions
      with .get(), so an unrecognised key (one typo) is silently ignored and
      the fixture passes having asserted nothing.

  # --- review of branch grind-near-tier, 2026-07-28 --------------------------
  # Findings from a multi-dimension review of PR #12. Sequenced so the harness
  # gap closes first (three of these need assertions it cannot express today)
